<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#10172b">
<title>Little Legs — A Stickman Platform Adventure</title>
<style>
  :root{color-scheme:dark;--ink:#17213a;--cream:#fff8e9;--mint:#9cf4c5;--coral:#ff786e;--gold:#ffcf66}
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#10172b;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif}
  body{display:grid;place-items:center}
  #shell{position:relative;width:min(100vw,177.7778vh);height:min(100vh,56.25vw);overflow:hidden;background:#95dded;box-shadow:0 24px 100px #0008}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #hud{position:absolute;inset:0;pointer-events:none;color:white;text-shadow:0 2px 5px #15233a70}
  .topbar{position:absolute;left:2.5%;right:2.5%;top:3%;display:flex;align-items:flex-start;justify-content:space-between}
  .brand,.chip{background:#17213adb;border:1px solid #ffffff25;border-radius:999px;box-shadow:0 7px 22px #17213a20;backdrop-filter:blur(8px)}
  .brand{padding:9px 16px;font-weight:950;letter-spacing:.13em;font-size:clamp(10px,1.3vw,16px)}
  .stats{display:flex;gap:8px;align-items:center}
  .chip{padding:8px 13px;font-size:clamp(10px,1.3vw,15px);font-weight:750}
  #levelName{color:var(--mint)}#coinCount{color:var(--gold)}
  #wallet{color:var(--gold)}
  .icon-btn{pointer-events:auto;border:1px solid #ffffff30;color:white;background:#17213adb;border-radius:50%;width:40px;height:40px;font-size:16px;cursor:pointer}
  #hint{position:absolute;bottom:3.5%;left:50%;transform:translateX(-50%);white-space:nowrap;color:#fff;font-size:clamp(10px,1.35vw,15px);font-weight:700;background:#17213aa8;padding:8px 15px;border-radius:99px;opacity:.9}
  #toast{position:absolute;top:15%;left:50%;transform:translate(-50%,-10px);padding:10px 18px;background:#17213adb;border:1px solid #ffffff30;border-radius:99px;font-weight:850;font-size:clamp(12px,1.5vw,17px);opacity:0;transition:.25s;white-space:nowrap}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #secretCode{display:none;position:absolute;z-index:3;left:50%;top:89%;transform:translateX(-50%);width:152px;height:26px;padding:4px 10px;border:1px solid #ffffff50;border-radius:8px;outline:none;background:#17213acc;color:#fff;text-align:center;font:700 12px ui-rounded,"Trebuchet MS",system-ui,sans-serif;letter-spacing:.12em;pointer-events:auto}
  #secretCode::placeholder{color:#c6d0df}
  #secretCode:focus{border-color:#9cf4c5;box-shadow:0 0 0 2px #9cf4c555}
  #touch{position:absolute;inset:auto 0 3% 0;display:none;justify-content:space-between;padding:0 4%;pointer-events:none}
  .touch-group{display:flex;gap:10px;align-items:flex-end}
  .touch-btn{pointer-events:auto;touch-action:none;user-select:none;width:clamp(48px,8vw,72px);height:clamp(48px,8vw,72px);border:1px solid #fff7;border-radius:22px;background:#17213a88;color:white;font-size:24px;font-weight:900;backdrop-filter:blur(8px)}
  .touch-btn:active,.touch-btn.down{background:#71dfadbb;transform:scale(.94)}
  @media (pointer:coarse){#touch{display:flex}#hint{bottom:17%}}
  @media (max-aspect-ratio:4/3){#shell{width:100vw;height:56.25vw;max-height:100vh} }
</style>
</head>
<body>
<main id="shell" aria-label="Little Legs platform adventure">
  <canvas id="game" width="960" height="540" aria-label="A colorful stickman platform game"></canvas>
  <section id="hud" aria-live="polite">
    <div class="topbar">
      <div class="brand">✦ LITTLE LEGS</div>
      <div class="stats"><div class="chip" id="levelName">MEADOW TRAIL</div><div class="chip" id="coinCount">◉ 0 / 0</div><div class="chip" id="wallet">◆ 0</div><button class="icon-btn" id="pauseBtn" aria-label="Pause">Ⅱ</button></div>
    </div>
    <div id="toast"></div>
    <input id="secretCode" type="text" maxlength="24" autocomplete="off" spellcheck="false" aria-label="Secret level unlock code" placeholder="secret code">
    <div id="hint">MOVE&nbsp; A / D &nbsp;·&nbsp; JUMP&nbsp; SPACE / ↑ &nbsp;·&nbsp; PAUSE&nbsp; P / ESC</div>
    <div id="touch">
      <div class="touch-group"><button class="touch-btn" data-key="left" aria-label="Move left">←</button><button class="touch-btn" data-key="right" aria-label="Move right">→</button></div>
      <div class="touch-group"><button class="touch-btn" data-key="jump" aria-label="Jump">↑</button></div>
    </div>
  </section>
</main>

  ];

  function makeBonusLevel(number){
    const themes=[
      {name:"CLOUDTOP",sky:"#94dff0",far:"#a5dcc6",near:"#72b18c",ground:"#76b98b",trim:"#b8e898",earth:"#57886f"},
      {name:"SUNSTONE",sky:"#ffc28b",far:"#dc957e",near:"#a95f70",ground:"#ae756a",trim:"#f4ba79",earth:"#89565e"},
      {name:"STARFALL",sky:"#363e78",far:"#54558d",near:"#303c69",ground:"#596494",trim:"#a2a9df",earth:"#333e68"},
      {name:"MINT GROVE",sky:"#9de3c4",far:"#a4c99d",near:"#6b9b75",ground:"#609b76",trim:"#b3e39a",earth:"#456e61"},
      {name:"BERRY BLUFF",sky:"#f4a8ae",far:"#d68ca3",near:"#946081",ground:"#a75e7f",trim:"#f6b6ad",earth:"#784966"}
    ];
    const seed=number-3,archetype=seed%6,theme=themes[Math.floor(seed/2)%themes.length];
    const sections=7+(seed%7),stride=400+(seed%4)*12;
    const platforms=[],spikes=[],coins=[],enemies=[],movers=[],checkpoints=[],switches=[],bridges=[],traps=[],boxes=[];
    for(let section=0;section<sections;section++){
      const start=section*stride,gap=section===sections-1?0:48+((seed*3+section*5)%4)*7;
      const groundY=(section+seed)%2===0?470:450,width=stride-gap;
      platforms.push([start,groundY,width,540-groundY]);
      if(section>0&&section%3===0)checkpoints.push({x:start+34,y:groundY-70});
      const stepX=start+82+((seed+section)%3)*12,coinY=groundY-91;
      if(archetype===0){
        platforms.push([stepX,groundY-75,98,16],[start+210,groundY-127,94,16],[start+320,groundY-70,72,16]);
        coins.push([stepX+40,groundY-112],[start+225,groundY-165],[start+327,groundY-107]);
      }else if(archetype===1){
        platforms.push([start+72,groundY-104,104,16],[start+226,groundY-78,118,16]);
        if(section%2===0)platforms.push([start+258,groundY-150,80,16]);
        coins.push([start+112,groundY-141],[start+255,groundY-115]);
        if(section%2===1)movers.push({x:start+135,y:groundY-42,w:86,h:14,axis:"y",range:28,speed:1.15+seed%3*.12,phase:section});
      }else if(archetype===2){
        platforms.push([start+95,groundY-86,88,16],[start+216,groundY-128,88,16],[start+323,groundY-72,70,16]);
        coins.push([start+119,groundY-123],[start+239,groundY-165],[start+329,groundY-109]);
        if(section%2===1&&section<sections-1){
          switches.push({x:start+width-53,y:groundY-28,bridge:bridges.length});
          bridges.push({x:start+width,y:groundY-16,w:gap+8,h:16,active:false});
        }
      }else if(archetype===3){
        const ledgeRise=96+(seed%3)*6;
        platforms.push([start+68,groundY-ledgeRise,118,16],[start+232,groundY-ledgeRise,118,16]);
        coins.push([start+111,groundY-ledgeRise-36],[start+274,groundY-ledgeRise-36],[start+180,groundY-66]);
        spikes.push([start+194,groundY-20,34,20]);
        if(section%2===0)enemies.push({x:start+230,y:groundY-28,min:start+205,max:start+350,speed:62+seed%5*5});
      }else if(archetype===4){
        platforms.push([start+76,groundY-78,100,16],[start+194,groundY-112,96,16],[start+307,groundY-78,70,16]);
        coins.push([start+104,groundY-115],[start+211,groundY-149],[start+315,groundY-115]);
        if(section%2===1&&section<sections-1){
          switches.push({x:start+width-55,y:groundY-28,bridge:bridges.length});
          bridges.push({x:start+width, y:groundY-16,w:gap+8,h:16,active:false});
        }
        if(section%3===1)boxes.push({x:start+270,y:groundY-42});
      }else{
        platforms.push([start+88,groundY-90,92,16],[start+211,groundY-90,94,16],[start+320,groundY-125,72,16]);
        coins.push([start+116,groundY-127],[start+237,groundY-127],[start+328,groundY-162]);
        movers.push({x:start+157,y:groundY-33,w:83,h:14,axis:section%2?"x":"y",range:24,speed:1.1+seed%4*.1,phase:section*.7});
        if(section%3===1)boxes.push({x:start+58,y:groundY-42});
      }
      if(section===0)coins.push([start+32,coinY]);
      if(section%2===1&&section<sections-1){
        const spikeX=start+Math.floor(width*.58);
        if(!spikes.some(spike=>spike[0]===spikeX))spikes.push([spikeX,groundY-20,34,20]);
      }
      if(section>0&&section%3===1&&!enemies.some(enemy=>enemy.x>=start&&enemy.x<start+stride)){
        const min=start+100,max=start+Math.max(180,width-34);
        enemies.push({x:min+20,y:groundY-28,min,max,speed:64+seed%7*4});
      }
      if(seed%4===0&&section===sections-2){
        traps.push({x:start+width-42,y:groundY-78,w:20,h:78,active:false,triggerX:start+width-105,triggerW:38});
      }
    }
    return{
      ...theme,
      name:`${theme.name} ${String(number+1).padStart(2,"0")}`,
      subtitle:["Stepping-stone switchbacks","Lift routes and floating ledges","A bridge-building shortcut","High ledges over a safe valley","Boxes, bridges and careful jumps","Moving platforms in open air"][archetype],
      length:sections*stride,goal:sections*stride-92,start:{x:65,y:416},
      platforms,spikes,coins,enemies,movers,checkpoints,switches,bridges,traps,boxes
    };
  }
  for(let number=3;number<33;number++)levels.push(makeBonusLevel(number));
  const SAVE_KEY="little-legs-progress-v2";
  function readProgress(){
    const empty={highestUnlocked:0,allUnlocked:false,run:null,bank:0,owned:["classic"],equipped:"classic"};
    try{
      const raw=window.localStorage.getItem(SAVE_KEY);
      if(!raw)return empty;
      const stored=JSON.parse(raw);
      return{
        highestUnlocked:Number.isInteger(stored.highestUnlocked)?Math.max(0,Math.min(stored.highestUnlocked,levels.length-1)):0,
        allUnlocked:stored.allUnlocked===true,
        run:stored.run&&Number.isInteger(stored.run.level)&&stored.run.level>=0&&stored.run.level<levels.length?stored.run:null,
        bank:Number.isInteger(stored.bank)&&stored.bank>=0?stored.bank:0,
        owned:Array.isArray(stored.owned)?[...new Set(["classic",...stored.owned.filter(id=>outfits.some(item=>item.id===id))])]:["classic"],
        equipped:typeof stored.equipped==="string"&&outfits.some(item=>item.id===stored.equipped)?stored.equipped:"classic"
      };
    }catch(error){console.warn("Saved game progress could not be read.",error);return empty}
  }
  const outfits=[
    {id:"classic",name:"Trail Starter",kind:"classic",price:0,shirt:"#26334b",accent:"#f4c9a5",description:"The original adventurer"},
    {id:"hoodie",name:"Sky Hoodie",kind:"hoodie",price:12,shirt:"#57aee8",accent:"#b8edff",description:"Comfy cloud-blue layers"},
    {id:"cape",name:"Sunset Cape",kind:"cape",price:18,shirt:"#f07865",accent:"#ffd16a",description:"A little extra wind"},
    {id:"crown",name:"Leaf Crown",kind:"crown",price:22,shirt:"#54a978",accent:"#c6ef82",description:"Fresh from the grove"},
    {id:"glasses",name:"Star Specs",kind:"glasses",price:28,shirt:"#604e9b",accent:"#ffe37a",description:"See the shiny things"},
    {id:"fox",name:"Fox Ears",kind:"fox",price:32,shirt:"#e98647",accent:"#fff0d3",description:"A clever little look"},
    {id:"boots",name:"Gold Boots",kind:"boots",price:36,shirt:"#55647b",accent:"#ffd45d",description:"Made for big jumps"},
    {id:"rainbow",name:"Rainbow Trail",kind:"rainbow",price:45,shirt:"#b96abf",accent:"#9cf4c5",description:"Leave a little color"}
  ];
  let savedProgress=readProgress(),selectionPage=0;
  function persistProgress(run=savedProgress.run){
    savedProgress.run=run;
    try{window.localStorage.setItem(SAVE_KEY,JSON.stringify(savedProgress))}
    catch(error){console.warn("Game progress could not be saved in this browser.",error)}
  }
  function updateWalletUI(){walletLabel.textContent=`◆ ${savedProgress.bank}`}
  function saveCurrentRun(){
    if(!world||!player)return;
    const checkpoint=world.checkpoints.findIndex(point=>point.active);
    persistProgress({
      level:levelIndex,checkpoint:Math.max(0,checkpoint),
      coins:world.coins.flatMap((coin,index)=>coin.got?[index]:[]),
      switches:world.switches.flatMap((sw,index)=>sw.pressed?[index]:[])
    });
  }
  function levelIsUnlocked(index){return savedProgress.allUnlocked||index<=savedProgress.highestUnlocked}

  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
  const ease=(a,b,t)=>a+(b-a)*t;
  function sound(freq=440,duration=.08,type="sine",volume=.045){
    if(muted)return;
    try{
      audio ||= new(window.AudioContext||window.webkitAudioContext)();
      if(audio.state==="suspended")audio.resume();
      const osc=audio.createOscillator(),gain=audio.createGain();
      osc.type=type;osc.frequency.setValueAtTime(freq,audio.currentTime);
      gain.gain.setValueAtTime(volume,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
      osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+duration);
    }catch(error){console.warn("Audio is unavailable in this browser.",error)}
  }
  function showToast(message){
    toast.textContent=message;toast.classList.add("show");toastTimer=1.5;
  }
  function loadLevel(index,{resume=false}={}){
    levelIndex=index;selectedLevel=index;
    const data=levels[index];
    const savedRun=resume&&savedProgress.run?.level===index?savedProgress.run:null;
    world={
      ...data,
      platforms:data.platforms.map(([x,y,w,h])=>({x,y,w,h,type:"ground"})),
      spikes:data.spikes.map(([x,y,w,h])=>({x,y,w,h})),
      movers:data.movers.map(m=>({...m,baseX:m.x,baseY:m.y,dx:0,dy:0,w:m.w,h:m.h})),
      boxes:data.boxes.map(b=>({...b,w:42,h:42,vx:0,vy:0})),
      coins:data.coins.map(([x,y])=>({x,y,w:20,h:20,got:false,phase:Math.random()*7})),
      enemies:data.enemies.map(e=>({...e,w:34,h:28,dir:1,alive:true,phase:Math.random()*7})),
      checkpoints:data.checkpoints.map(c=>({...c,w:36,h:70,active:false})),
      switches:data.switches.map(s=>({...s,w:34,h:28,pressed:false})),
      bridges:data.bridges.map(b=>({...b})),
      traps:data.traps.map(t=>({...t,armed:false})),
      cameraX:0
    };
    const safeStart=findSafeSpawn(data.start.x);

  function findSafeSpawn(x){
    const characterWidth=24,characterHeight=54;
    const candidates=[x,x-24,x+24,x-48,x+48];
    for(const candidate of candidates){
      const spawnX=clamp(candidate,0,world.length-characterWidth);
      const floor=world.platforms.find(platform=>platform.y>=400&&spawnX>=platform.x+4&&spawnX+characterWidth<=platform.x+platform.w-4);
      if(!floor)continue;
      const spawn={x:spawnX,y:floor.y-characterHeight};
      const body={...spawn,w:characterWidth,h:characterHeight};
      if(world.spikes.some(spike=>overlap({x:body.x+4,y:body.y+body.h-16,w:body.w-8,h:16},spike)))continue;
      if(world.traps.some(trap=>trap.active&&overlap(body,trap)))continue;
      return spawn;
    }
    const floor=world.platforms.find(platform=>world.start.x>=platform.x&&world.start.x+characterWidth<=platform.x+platform.w);

    ctx.strokeStyle=outfit.shirt;ctx.lineWidth=5;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(0,shoulderY+pushLean);ctx.lineTo(0,hipY);ctx.stroke();
    const kneeY1=hipY+11+Math.max(0,legSwing)*5,kneeY2=hipY+11+Math.max(0,-legSwing)*5;
    const leg1X=5+legSwing*12,leg2X=-5-legSwing*12;
    limb(0,hipY,leg1X,kneeY1,4,legColor);
    limb(leg1X,kneeY1,leg1X+3+Math.max(0,legSwing)*8,ground-1,4,legColor);
    limb(0,hipY,leg2X,kneeY2,4,legColor);
    limb(leg2X,kneeY2,leg2X-3-Math.max(0,-legSwing)*8,ground-1,4,legColor);
    ctx.fillStyle="#f4c9a5";ctx.beginPath();ctx.arc(0,headY,9,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#26334b";ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,headY,9,Math.PI,Math.PI*2);ctx.stroke();
    if(outfit.kind==="crown"){
      ctx.fillStyle=outfit.accent;ctx.beginPath();ctx.moveTo(-8,headY-7);ctx.lineTo(-6,headY-17);ctx.lineTo(-1,headY-10);ctx.lineTo(3,headY-18);ctx.lineTo(8,headY-7);ctx.closePath();ctx.fill();
    }else if(outfit.kind==="fox"){
      ctx.fillStyle=outfit.shirt;ctx.beginPath();ctx.moveTo(-8,headY-3);ctx.lineTo(-12,headY-17);ctx.lineTo(-1,headY-8);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(2,headY-8);ctx.lineTo(12,headY-17);ctx.lineTo(8,headY-3);ctx.closePath();ctx.fill();
    }else if(outfit.kind==="hoodie"){
      ctx.strokeStyle=outfit.accent;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,headY+1,11,Math.PI,Math.PI*2);ctx.stroke();
    }else if(outfit.kind==="glasses"){
      ctx.strokeStyle=outfit.accent;ctx.lineWidth=2;ctx.strokeRect(-5,headY-4,6,5);ctx.strokeRect(2,headY-4,6,5);ctx.beginPath();ctx.moveTo(1,headY-2);ctx.lineTo(2,headY-2);ctx.stroke();
    }
    if(outfit.kind==="cape"){
      ctx.fillStyle=outfit.accent;ctx.beginPath();ctx.moveTo(-2,shoulderY+2);ctx.lineTo(-13,hipY+10);ctx.lineTo(-3,hipY+7);ctx.closePath();ctx.fill();
    }else if(outfit.kind==="rainbow"){
      ctx.strokeStyle=`hsl(${Math.floor(time*100)%360} 90% 68%)`;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-2,shoulderY+2);ctx.lineTo(-12,hipY+7);ctx.stroke();
    }else if(outfit.kind==="boots"){
      limb(leg1X+1,ground-1,leg1X+10,ground-1,5,outfit.accent);
      limb(leg2X-1,ground-1,leg2X-10,ground-1,5,outfit.accent);
    }
    ctx.fillStyle="#24324c";ctx.beginPath();ctx.arc(3,headY-1,1.2,0,Math.PI*2);ctx.fill();
    if(p.state==="dead"){
      ctx.strokeStyle="#26334b";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(1,headY-2);ctx.lineTo(5,headY+2);ctx.moveTo(5,headY-2);ctx.lineTo(1,headY+2);ctx.stroke();
    }else if(p.state==="win"){
      ctx.strokeStyle="#c75d5b";ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(2,headY+3,3,.1,Math.PI-.1);ctx.stroke();
    }else{
      ctx.fillStyle="#26334b";ctx.beginPath();ctx.arc(3,headY-1,1.2,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }

  function drawOverlay(){
    if(screen==="game")return;
    ctx.fillStyle="#11182c9c";ctx.fillRect(0,0,W,H);
    if(screen==="menu"){
      drawLogo();
      drawCard(278,260,404,230);
      text("A tiny hero. A big adventure.",480,295,17,"#dfe9ff",700);
      if(savedProgress.run){
        const resumeIndex=savedProgress.run.level;
        button(`CONTINUE · LEVEL ${String(resumeIndex+1).padStart(2,"0")}`,350,316,260,42,palette.mint,"#173449",()=>loadLevel(resumeIndex,{resume:true}));
        button("CHOOSE A LEVEL",350,364,260,38,"#ffc28b","#34344a",()=>{selectionPage=0;screen="select"});
        button("COIN OUTFIT SHOP",390,408,180,33,"#b6baff","#27314c",openShop);
      }else{
        button("PLAY",360,337,240,48,palette.mint,"#173449",()=>{selectionPage=0;screen="select"});
        button("COIN OUTFIT SHOP",390,394,180,34,"#b6baff","#27314c",openShop);
      }
      text("RUN  ·  JUMP  ·  COLLECT  ·  MAKE IT HOME",480,459,10,"#d4dbea",800,1.2);
    }else if(screen==="select"){
      text("PICK YOUR PATH",480,108,36,palette.cream,950);
      text("Every trail has a new trick up its sleeve.",480,143,15,"#d4dbea",650);
        const pageCount=Math.ceil(levels.length/12),first=selectionPage*12;
        for(let offset=0;offset<12&&first+offset<levels.length;offset++){
          const index=first+offset,col=offset%4,row=Math.floor(offset/4);
          const x=40+col*225,y=158+row*103,w=205,h=92,unlocked=levelIsUnlocked(index);
          const color=["#a6efc5","#ffc28b","#b6baff","#9de3c4","#f4a8ae"][(index+Math.floor(index/3))%5];
          ctx.fillStyle="#17213aed";roundedRect(x,y,w,h,15,ctx.fillStyle);
          ctx.strokeStyle="#ffffff22";ctx.lineWidth=1;roundedRect(x,y,w,h,15,null,ctx.strokeStyle);
          text(String(index+1).padStart(2,"0"),x+23,y+24,13,color,950,1);
          text(levels[index].name,x+w/2+12,y+24,Math.min(14,150/Math.max(1,levels[index].name.length)*2),palette.cream,900);
          button(unlocked?"PLAY LEVEL":"LOCKED",x+13,y+47,w-26,34,unlocked?color:"#566078",unlocked?"#17213a":"#d4dbea",()=>{if(unlocked)loadLevel(index)});
        }
        button("← MENU",32,34,112,40,"#303a59",palette.cream,goMenu);
        button("COIN SHOP",814,34,112,40,"#b6baff","#27314c",openShop);
        if(selectionPage>0)button("← PREVIOUS",32,478,150,38,"#303a59",palette.cream,()=>selectionPage--);
        text(`PAGE ${selectionPage+1} / ${pageCount}`,480,497,13,"#d4dbea",850,1);
        if(selectionPage<pageCount-1)button("NEXT →",778,478,150,38,"#303a59",palette.cream,()=>selectionPage++);
      button("← MENU",32,34,112,40,"#303a59",palette.cream,goMenu);
    }else if(screen==="pause"){
      drawCard(330,145,300,260);
      text("TAKE A BREATHER",480,196,27,palette.cream,950);
      text("The adventure can wait.",480,223,14,"#d4dbea",650);
      button("KEEP GOING",375,252,210,48,palette.mint,"#173449",resume);
      button("RESTART LEVEL",375,309,210,42,"#ffcf66","#34344a",restart);
      button("LEVEL SELECT",375,360,210,38,"#ff8a7b","#382d42",()=>{screen="select"});
    }else if(screen==="shop"){
      text("THE OUTFIT NOOK",480,69,34,palette.cream,950);
      text(`Spend your trail coins · balance: ${savedProgress.bank} ◆`,480,101,15,"#d4dbea",700);
      const positions=[[61,132],[286,132],[511,132],[736,132],[61,303],[286,303],[511,303],[736,303]];
      outfits.forEach((item,index)=>{
        const [x,y]=positions[index],owned=savedProgress.owned.includes(item.id),equipped=savedProgress.equipped===item.id;
        const cardFill=equipped?"#314d53":"#17213aed";
        roundedRect(x,y,163,151,17,cardFill,"#ffffff28");
        ctx.save();ctx.translate(x+81,y+42);
        const sample={x:-12,y:-24,w:24,h:54,facing:1,state:"idle",anim:time*2,invuln:0,land:0,push:0};
        drawOutfitPreview(sample,item);
        ctx.restore();
        text(item.name,x+81,y+84,14,palette.cream,900);
        text(item.description,x+81,y+102,10,"#c0cbe0",650);
        const label=equipped?"EQUIPPED":owned?"WEAR":`${item.price} COINS`;
        button(label,x+12,y+116,139,27,equipped?palette.mint:owned?"#ffc876":"#64748b",equipped?"#173449":"#263149",()=>buyOrEquipOutfit(item.id));
      });
      button("← MENU",32,478,130,38,"#303a59",palette.cream,goMenu);
      button("BACK TO LEVELS",778,478,150,38,"#303a59",palette.cream,()=>{screen="select"});
    }
  }
  function drawOutfitPreview(sample,item){
    const x=sample.x+12,y=sample.y+22;
    ctx.strokeStyle=item.shirt;ctx.lineWidth=4;ctx.lineCap="round";ctx.beginPath();
    ctx.moveTo(x,y-13);ctx.lineTo(x,y+3);ctx.moveTo(x,y-10);ctx.lineTo(x-9,y-4);ctx.moveTo(x,y-10);ctx.lineTo(x+9,y-4);ctx.moveTo(x,y+3);ctx.lineTo(x-7,y+16);ctx.moveTo(x,y+3);ctx.lineTo(x+7,y+16);ctx.stroke();
    ctx.fillStyle="#f4c9a5";ctx.beginPath();ctx.arc(x,y-22,7,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=item.shirt;
    if(item.kind==="crown"){ctx.beginPath();ctx.moveTo(x-7,y-27);ctx.lineTo(x-5,y-36);ctx.lineTo(x,y-30);ctx.lineTo(x+4,y-37);ctx.lineTo(x+7,y-27);ctx.fill()}
    if(item.kind==="fox"){ctx.beginPath();ctx.moveTo(x-6,y-27);ctx.lineTo(x-10,y-38);ctx.lineTo(x-1,y-30);ctx.fill();ctx.beginPath();ctx.moveTo(x+2,y-30);ctx.lineTo(x+10,y-38);ctx.lineTo(x+6,y-27);ctx.fill()}
    if(item.kind==="cape"){ctx.fillStyle=item.accent;ctx.beginPath();ctx.moveTo(x-2,y-13);ctx.lineTo(x-13,y+1);ctx.lineTo(x-2,y-3);ctx.fill()}
    if(item.kind==="glasses"){ctx.strokeStyle=item.accent;ctx.lineWidth=2;ctx.strokeRect(x-5,y-25,5,4);ctx.strokeRect(x+1,y-25,5,4)}
    if(item.kind==="boots"){ctx.strokeStyle=item.accent;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x-7,y+16);ctx.lineTo(x-11,y+16);ctx.moveTo(x+7,y+16);ctx.lineTo(x+11,y+16);ctx.stroke()}
  }
  function drawLogo(){
    ctx.save();ctx.translate(480,188);
    ctx.fillStyle="#ffca64";ctx.beginPath();ctx.arc(0,0,82,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#ffe89c";ctx.beginPath();ctx.arc(-18,-24,19,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#28324a";ctx.lineWidth=8;ctx.lineCap="round";ctx.beginPath();ctx.arc(0,-9,24,Math.PI,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,16);ctx.lineTo(0,49);ctx.moveTo(0,24);ctx.lineTo(-23,37);ctx.moveTo(0,24);ctx.lineTo(20,37);ctx.moveTo(0,49);ctx.lineTo(-18,70);ctx.moveTo(0,49);ctx.lineTo(18,70);ctx.stroke();
    ctx.fillStyle="#26334b";ctx.beginPath();ctx.arc(8,-11,2.4,0,Math.PI*2);ctx.fill();
    ctx.restore();
    text("LITTLE LEGS",480,102,50,palette.cream,1000,3);
    text("A STICKMAN PLATFORM ADVENTURE",480,132,12,"#dbe6f5",850,3);
  }
  function drawMiniStick(x,y){
    ctx.strokeStyle="#27344c";ctx.lineWidth=4;ctx.lineCap="round";ctx.beginPath();
    ctx.arc(x,y-8,7,0,Math.PI*2);ctx.moveTo(x,y-1);ctx.lineTo(x,y+17);ctx.moveTo(x,y+5);ctx.lineTo(x-12,y+13);ctx.moveTo(x,y+5);ctx.lineTo(x+12,y+13);ctx.moveTo(x,y+17);ctx.lineTo(x-10,y+28);ctx.moveTo(x,y+17);ctx.lineTo(x+10,y+28);ctx.stroke();
  }
  function drawCard(x,y,w,h){
    ctx.fillStyle="#17213aee";roundedRect(x,y,w,h,24,ctx.fillStyle);
    ctx.strokeStyle="#ffffff25";ctx.lineWidth=1;roundedRect(x,y,w,h,24,null,ctx.strokeStyle);
  }
  function text(value,x,y,size,color,weight=700,spacing=0){
    ctx.fillStyle=color;ctx.font=`${weight} ${size}px ui-rounded,"Trebuchet MS",system-ui,sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";
    if(!spacing){ctx.fillText(value,x,y);return}
    const chars=[...value],widths=chars.map(c=>ctx.measureText(c).width),total=widths.reduce((a,b)=>a+b,0)+spacing*(chars.length-1);
    let start=x-total/2;for(let i=0;i<chars.length;i++){ctx.fillText(chars[i],start+widths[i]/2,y);start+=widths[i]+spacing}
  }
  function button(label,x,y,w,h,fill,color,action){
    const hover=pointer.x>=x&&pointer.x<=x+w&&pointer.y>=y&&pointer.y<=y+h;
    ctx.fillStyle=hover?"#ffffff":fill;roundedRect(x,y+(hover?-2:0),w,h,14,ctx.fillStyle);
    ctx.fillStyle=color;ctx.font=`900 ${Math.min(15,h*.37)}px ui-rounded,"Trebuchet MS",system-ui,sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(label,x+w/2,y+h/2+(hover?-2:0));
    if(pointer.clicked&&hover)action();
  }
  const pointer={x:-1,y:-1,clicked:false};
  function render(){
    secretInput.style.display=screen==="menu"?"block":"none";
    if(screen==="game"||screen==="pause"){
      drawBackground();if(world)drawWorld();
      if(screen==="pause")drawOverlay();
    }else{
      ctx.fillStyle="#19223e";ctx.fillRect(0,0,W,H);
      camera.x=0;drawBackground();
      if(screen==="menu"){
        const demoY=390+Math.sin(time*2)*5;drawMiniStick(790,demoY);
        ctx.fillStyle="#ffffff27";ctx.fillRect(0,455,W,85);ctx.fillStyle="#78b97d";ctx.fillRect(0,455,W,12);
      }
      drawOverlay();
    }
    if(camera.shake>0){
      const dx=(Math.random()-.5)*camera.shake,dy=(Math.random()-.5)*camera.shake;
      ctx.save();ctx.translate(dx,dy);ctx.restore();
    }
  }
  function frame(now){
    const elapsed=Math.min(.05,(now-lastTime)/1000||0);lastTime=now;accumulator+=elapsed;
    while(accumulator>=STEP){update(STEP);accumulator-=STEP}
    render();pointer.clicked=false;requestAnimationFrame(frame);
  }
  function canvasPoint(e){
    const rect=canvas.getBoundingClientRect();
    pointer.x=(e.clientX-rect.left)*W/rect.width;pointer.y=(e.clientY-rect.top)*H/rect.height;
  }
  canvas.addEventListener("pointermove",canvasPoint);
  canvas.addEventListener("pointerdown",e=>{canvasPoint(e);pointer.clicked=true});
  canvas.addEventListener("pointerup",()=>{});
  function setKey(code,down){
    if(["ArrowLeft","KeyA"].includes(code))keys.left=down;
    if(["ArrowRight","KeyD"].includes(code))keys.right=down;
    if(["ArrowUp","Space","KeyW"].includes(code)){if(down&&!keys.jump&&screen==="game")player.jumpBuffer=.14;keys.jump=down}
  }
  const secretInput=document.querySelector("#secretCode");
  secretInput.addEventListener("input",()=>{
    if(secretInput.value.trim().toLowerCase()!=="yashaswi")return;
    savedProgress.allUnlocked=true;savedProgress.highestUnlocked=levels.length-1;
    persistProgress(savedProgress.run);secretInput.value="";showToast("All 33 levels unlocked!");
  });
  window.addEventListener("keydown",e=>{
    if(["ArrowLeft","ArrowRight","ArrowUp","Space"].includes(e.code))e.preventDefault();
    if(e.repeat&&["Escape","KeyP","KeyR"].includes(e.code))return;
    if(["ArrowLeft","ArrowRight","ArrowUp","Space","KeyA","KeyD","KeyW"].includes(e.code))setKey(e.code,true);
    if(e.code==="Escape"||e.code==="KeyP"){if(screen==="game")pause();else if(screen==="pause")resume()}
    if(e.code==="KeyR"&&screen==="game")restart();
    if(e.code==="Enter"&&screen==="menu"&&e.target!==secretInput){selectionPage=0;screen="select"}
    if(e.code==="KeyM")muted=!muted;
  });
  window.addEventListener("keyup",e=>setKey(e.code,false));
  window.addEventListener("blur",()=>{keys.left=keys.right=keys.jump=false;if(screen==="game")pause()});
  document.querySelectorAll(".touch-btn").forEach(button=>{
    const name=button.dataset.key;
    const release=e=>{e.preventDefault();keys[name]=false;button.classList.remove("down")};
    button.addEventListener("pointerdown",e=>{e.preventDefault();button.setPointerCapture(e.pointerId);keys[name]=true;button.classList.add("down");if(name==="jump"&&screen==="game")player.jumpBuffer=.14});
    button.addEventListener("pointerup",release);button.addEventListener("pointercancel",release);button.addEventListener("lostpointercapture",release);
  });
  pauseButton.addEventListener("click",()=>screen==="game"?pause():screen==="pause"?resume():null);
  window.addEventListener("resize",()=>{});
  updateWalletUI();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
